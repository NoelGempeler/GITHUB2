        ].join(";");

        // Soft contact shadow under/behind the tipping sheet
        const contact = document.createElement("div");
        contact.style.cssText = [
          "position:absolute",
          "left:0",
          "right:0",
          "bottom:0",
          "height:40%",
          "pointer-events:none",
          "background:linear-gradient(to top, rgba(0,0,0,0.45), transparent)",
          "opacity:0",
          "transform:translateZ(-1px)",
        ].join(";");

        sheet.appendChild(face);
        sheet.appendChild(shade);
        sheet.appendChild(contact);
        stage.appendChild(sheet);
        document.body.appendChild(stage);

        const hold = 0.04;
        const duration = 1.15;
        const start = performance.now();

        const tick = (now) => {
          const t = (now - start) / 1000;
          if (t < hold) {
            requestAnimationFrame(tick);
            return;
          }

          const e = easeInCubic(Math.min(1, (t - hold) / duration));
          const angle = e * 90;
          sheet.style.transform = `rotateX(${angle}deg)`;
          shade.style.opacity = String(Math.min(1, e * 1.25));
          contact.style.opacity = String(e * 0.85);

          if (t < hold + duration) {
            requestAnimationFrame(tick);
          } else {
            stage.remove();
            onComplete();
          }
        };

        requestAnimationFrame(tick);
      }

      // --- fall2: real rigid plate (canvas-projected), push at click, tip AWAY ---
      //
      // Own 3D math (not CSS rotateX) so the direction can't flip by accident:
      //   Y-up, +Z toward viewer, hinge on the slider (y=0).
      //   +φ tips the top to -Z = away from you.
      //   Gravity torque + click impulse; solid textured front+back.
      //
      function runFall2(sourceCanvas, click, onComplete) {
        const prev = document.getElementById("shatter-layer");
        if (prev) prev.remove();

        const w = sourceCanvas.width;
        const h = sourceCanvas.height;
        const ox =
          click && Number.isFinite(click.x)
            ? Math.min(w, Math.max(0, click.x))
            : w / 2;
        const oy =
          click && Number.isFinite(click.y)
            ? Math.min(h, Math.max(0, click.y))
            : h * 0.4;

        const canvas = document.createElement("canvas");
        canvas.id = "shatter-layer";
        // Taller than the viewport so the plate can fall out the bottom
        const canvasH = Math.ceil(h * 2.2);
        canvas.width = w;
        canvas.height = canvasH;
        canvas.style.cssText = [
          "position:fixed",
          "top:0",
          "left:0",
          `width:${w}px`,
          `height:${canvasH}px`,
          "z-index:9999",
          "pointer-events:none",
          "display:block",
          "margin:0",
          "padding:0",
          "border:0",
        ].join(";");
        document.body.appendChild(canvas);
        const ctx = canvas.getContext("2d");

        // Back face — solid, slightly grey so the plane never looks hollow
        const back = document.createElement("canvas");
        back.width = w;
        back.height = h;
        const bctx = back.getContext("2d");
        bctx.fillStyle = "#e8e8e8";
        bctx.fillRect(0, 0, w, h);
        bctx.drawImage(sourceCanvas, 0, 0);
        bctx.fillStyle = "rgba(0,0,0,0.18)";
        bctx.fillRect(0, 0, w, h);

        // --- rigid body (thin plate, hinge along bottom edge on the slider) ---
        const mass = 1;
        const H = h;
        const I = (mass * H * H) / 3;
        const com = H / 2;
        const g = 3000;

        // Click push into the screen (−Z). Lever = height above hinge.
        const lever = Math.max(56, h - oy);
        const side = (ox - w / 2) / Math.max(1, w / 2);
        const J = 5.2 + (lever / H) * 3.8; // impulse magnitude
        // τ = r × F with F=(0,0,−J), r=(0,lever,0) → τ_x = −lever·(−J)? 
        // We define +φ = away; set ω from |τ|/I in the +φ direction.
        let phi = 0.001;
        let omega = (J * lever) / I;

        // Light yaw from off-center push (rotation about vertical)
        let yaw = 0;
        let omegaYaw = -side * (J * 0.35 * H) / I;

        let hinged = true;
        // Free body COM in phys space (Y-up, origin at hinge rest)
        let comX = side * 8;
        let comY = com;
        let comZ = 0;
        let vx = 0;
        let vy = 0;
        let vz = 0;

        const focal = 1100;

        function rotatePoint(x, y, z, phi_, yaw_) {
          // yaw about Y through origin, then tip about X (away: z → −y·sin)
          const cy = Math.cos(yaw_);
          const sy = Math.sin(yaw_);
          let x1 = x * cy + z * sy;
          let y1 = y;
          let z1 = -x * sy + z * cy;
          const cp = Math.cos(phi_);
          const sp = Math.sin(phi_);
          // +φ: (x, y, 0) → (x, y·cp, −y·sp)  top goes to −Z = AWAY
          const x2 = x1;
          const y2 = y1 * cp;
          const z2 = z1 * cp - y1 * sp;
          return [x2, y2, z2];
        }

        function project(x, y, z) {
          // Perspective: objects with z<0 (away) shrink
          const d = focal / (focal - z);
          return {
            x: w / 2 + x * d,
            y: h - y * d,
          };
        }

        // Local plate corners relative to hinge at (0,0,0), Y-up
        // Foot centered under click: shift local X so hinge foot ≈ click
        const footX = ox - w / 2;
        function cornersWorld() {
          const local = [
            [-w / 2 - footX, 0, 0],
            [w / 2 - footX, 0, 0],
            [w / 2 - footX, H, 0],
            [-w / 2 - footX, H, 0],
          ];
          // UVs match source image
          const uvs = [
            [0, h],
            [w, h],
            [w, 0],
            [0, 0],
          ];
          const out = [];
          for (let i = 0; i < 4; i++) {
            let [x, y, z] = local[i];
            if (hinged) {
              [x, y, z] = rotatePoint(x, y, z, phi, yaw);
              // hinge fixed at bottom center under click
              x += footX;
            } else {
              // free: rotate about COM then place COM
              x -= 0;
              y -= com;
              [x, y, z] = rotatePoint(x, y, z, phi, yaw);
              x += comX;
              y += comY;
              z += comZ;
            }
            const p = project(x, y, z);
            out.push({
              x: p.x,
              y: p.y,
              z,
              u: uvs[i][0],
              v: uvs[i][1],
            });
          }
          return out;
        }

        function drawTri(img, a, b, c) {
          const x0 = a.u;
          const y0 = a.v;
          const x1 = b.u;
          const y1 = b.v;
          const x2 = c.u;
          const y2 = c.v;
          const u0 = a.x;
          const v0 = a.y;
          const u1 = b.x;
          const v1 = b.y;
          const u2 = c.x;
          const v2 = c.y;
          const delta = x0 * (y1 - y2) + x1 * (y2 - y0) + x2 * (y0 - y1);
          if (Math.abs(delta) < 1e-4) return;
          const ma = (u0 * (y1 - y2) + u1 * (y2 - y0) + u2 * (y0 - y1)) / delta;
          const mb = (u0 * (x2 - x1) + u1 * (x0 - x2) + u2 * (x1 - x0)) / delta;
          const mc =
            (u0 * (x1 * y2 - x2 * y1) +
              u1 * (x2 * y0 - x0 * y2) +
              u2 * (x0 * y1 - x1 * y0)) /
            delta;
          const md = (v0 * (y1 - y2) + v1 * (y2 - y0) + v2 * (y0 - y1)) / delta;
          const me = (v0 * (x2 - x1) + v1 * (x0 - x2) + v2 * (x1 - x0)) / delta;
          const mf =
            (v0 * (x1 * y2 - x2 * y1) +
              v1 * (x2 * y0 - x0 * y2) +
              v2 * (x0 * y1 - x1 * y0)) /
            delta;
          ctx.save();
          ctx.beginPath();
          ctx.moveTo(u0, v0);
          ctx.lineTo(u1, v1);
          ctx.lineTo(u2, v2);
          ctx.closePath();
          ctx.clip();
          ctx.setTransform(ma, md, mb, me, mc, mf);
          ctx.drawImage(img, 0, 0);
          ctx.setTransform(1, 0, 0, 1, 0, 0);
          ctx.restore();
        }

        function facingFront(c) {
          // Cross of edges in screen space — or use average z normal
          // Phys normal starts +Z; after tip about X: n = (0, sinφ, cosφ) roughly
          // Front faces viewer when nz > 0
          const cp = Math.cos(phi);
          const sp = Math.sin(phi);
          // normal (0,0,1) → after away tip: (0, sp, cp) in our R? 
          // R maps (0,0,1): from rotatePoint logic z2 = z*cp - y*sp, y2 = y*cp
          // normal transform: (0, sinφ, cosφ) for away tip — viewer sees front while cosφ>0
          return Math.cos(phi) * Math.cos(yaw) > 0;
        }

        let last = performance.now();
        const t0 = last;

        const tick = (now) => {
          let dt = (now - last) / 1000;
          last = now;
          dt = Math.min(0.033, Math.max(0.001, dt));
          // Substep for stability
          const steps = 2;
          const hdt = dt / steps;
          for (let s = 0; s < steps; s++) {
            if (hinged) {
              const tau = mass * g * com * Math.sin(phi);
              const alpha = tau / I;
              omega += alpha * hdt;
              omega *= 1 - 0.12 * hdt;
              phi += omega * hdt;
              omegaYaw *= 1 - 0.5 * hdt;
              yaw += omegaYaw * hdt;

              if (phi > (95 * Math.PI) / 180) {
                hinged = false;
                // COM world position at release
                const [_, cy, cz] = rotatePoint(0, com, 0, phi, yaw);
                comX = footX;
                comY = cy;
                comZ = cz;
                // Velocity of COM ≈ ω × r
                const tip = omega * com;
                vz = -Math.abs(Math.cos(phi)) * tip - Math.abs(omega) * com * 0.3;
                vy = -Math.sin(phi) * tip;
                vx = side * Math.abs(tip) * 0.25;
              }
            } else {
              vy -= g * hdt;
              vz -= 30 * hdt;
              comX += vx * hdt;
              comY += vy * hdt;
              comZ += vz * hdt;
              omega *= 1 - 0.06 * hdt;
              phi += omega * hdt;
              yaw += omegaYaw * hdt;
            }
          }

          ctx.setTransform(1, 0, 0, 1, 0, 0);
          ctx.clearRect(0, 0, w, canvasH);

          const c = cornersWorld();
          // Painter: if back facing, draw back first feel — pick texture by facing
          const front = facingFront(c);
          const img = front ? sourceCanvas : back;
          // Average depth sort of two tris
          const t1 = [c[0], c[1], c[2]];
          const t2 = [c[0], c[2], c[3]];
          const z1 = (t1[0].z + t1[1].z + t1[2].z) / 3;
          const z2 = (t2[0].z + t2[1].z + t2[2].z) / 3;
          const order = z1 < z2 ? [t1, t2] : [t2, t1];
          // For back face, UV flip horizontally so it doesn't look mirrored wrong
          if (!front) {
            order.forEach((tri) => {
              // back canvas already darkened; draw as-is
              drawTri(img, tri[0], tri[1], tri[2]);
            });
          } else {
            order.forEach((tri) => drawTri(img, tri[0], tri[1], tri[2]));
          }

          // Soft contact shadow on the slider while hinged
          if (hinged && phi < Math.PI / 2) {
            const a = Math.min(0.35, 0.08 + phi * 0.25);
            ctx.save();
            ctx.globalAlpha = a;
            ctx.fillStyle = "#000";
            ctx.beginPath();
            ctx.ellipse(ox, h - 4, 80 + phi * 40, 10 + phi * 8, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          }

          const done =
            now - t0 > 3200 ||
            comY < -H * 0.6 ||
            ( !hinged && comZ < -H * 1.2) ||
            phi > Math.PI * 1.2;

          if (!done) requestAnimationFrame(tick);
          else {
            canvas.remove();
            onComplete();
          }
        };

        requestAnimationFrame(tick);
      }

      // --- shrink: viewport scales into the click at constant speed (no fade) ---
      function runShrink(sourceCanvas, click, onComplete) {
        const prev = document.getElementById("shatter-layer");
        if (prev) prev.remove();

        const w = sourceCanvas.width;
        const h = sourceCanvas.height;
        const ox =
          click && Number.isFinite(click.x)
            ? Math.min(w, Math.max(0, click.x))
            : w / 2;
        const oy =
          click && Number.isFinite(click.y)
            ? Math.min(h, Math.max(0, click.y))
            : h / 2;

        const stage = document.createElement("div");
        stage.id = "shatter-layer";
        stage.style.cssText = [
          "position:fixed",
          "top:0",
          "left:0",
          `width:${w}px`,
          `height:${h}px`,
          "z-index:9999",
          "pointer-events:none",
          "overflow:visible",
          "background:transparent",
        ].join(";");

        const sheet = document.createElement("div");
        sheet.style.cssText = [
          "position:relative",
          `width:${w}px`,
          `height:${h}px`,
          `transform-origin:${ox}px ${oy}px`,
          "transform:scale(1)",
          "will-change:transform",
          "opacity:1",
        ].join(";");

        const face = document.createElement("canvas");
        face.width = w;
        face.height = h;
        face.getContext("2d").drawImage(sourceCanvas, 0, 0);
        face.style.cssText = [
          `width:${w}px`,
          `height:${h}px`,
          "display:block",
        ].join(";");

        sheet.appendChild(face);
        stage.appendChild(sheet);
        document.body.appendChild(stage);

        const hold = 0.02;
        const duration = 0.7;
        const start = performance.now();

        const tick = (now) => {
          const t = (now - start) / 1000;
          if (t < hold) {
            requestAnimationFrame(tick);
            return;
          }

          // Linear — constant shrink speed, no fade
          const e = Math.min(1, (t - hold) / duration);
          const s = 1 - e;
          sheet.style.transform = `scale(${s})`;
          sheet.style.opacity = "1";

          if (e < 1) {
            requestAnimationFrame(tick);
          } else {
            stage.remove();
            onComplete();
          }
        };

        requestAnimationFrame(tick);
      }

      // --- drape: left/right panels — two bursts (ease to stop), then exit ---
      function runDrape(sourceCanvas, _click, onComplete) {
        const prev = document.getElementById("shatter-layer");
        if (prev) prev.remove();

        const w = sourceCanvas.width;
        const h = sourceCanvas.height;
        const mid = w / 2;
        const foldsPerSide = 12;

        const stage = document.createElement("div");
        stage.id = "shatter-layer";
        stage.style.cssText = [
          "position:fixed",
          "top:0",
          "left:0",
          `width:${w}px`,
          `height:${h}px`,
          "z-index:9999",
          "pointer-events:none",
          "perspective:1800px",
          "perspective-origin:50% 50%",
          "overflow:visible",
          "background:transparent",
        ].join(";");

        function makeSide(side) {
          const panel = document.createElement("div");
          panel.style.cssText = [
            "position:absolute",
            "top:0",
            side === "left" ? "left:0" : "right:0",
            `width:${mid}px`,
            `height:${h}px`,
            "display:flex",
            "transform-style:preserve-3d",
            "will-change:transform",
          ].join(";");

          const foldW = mid / foldsPerSide;
          const strips = [];

          for (let i = 0; i < foldsPerSide; i++) {
            const srcX =
              side === "left" ? i * foldW : mid + i * foldW;

            const strip = document.createElement("canvas");
            strip.width = Math.ceil(foldW);
            strip.height = h;
            const ctx = strip.getContext("2d");
            ctx.drawImage(
              sourceCanvas,
              srcX,
              0,
              foldW,
              h,
              0,
              0,
              strip.width,
              h,
            );

            const valley = i % 2 === 0;
            const shade = document.createElement("div");
            shade.style.cssText = [
              "position:absolute",
              "inset:0",
              "pointer-events:none",
              valley
                ? "background:linear-gradient(90deg, rgba(0,0,0,0.28), rgba(0,0,0,0.05) 45%, rgba(255,255,255,0.08))"
                : "background:linear-gradient(90deg, rgba(255,255,255,0.12), rgba(0,0,0,0.18))",
            ].join(";");

            const wrap = document.createElement("div");
            wrap.style.cssText = [
              "position:relative",
              `width:${foldW}px`,
              `height:${h}px`,
              "flex:0 0 auto",
              "transform-style:preserve-3d",
              "transform-origin:50% 50%",
              "will-change:transform",
              "overflow:hidden",
            ].join(";");

            strip.style.cssText = "display:block;width:100%;height:100%;";
            wrap.appendChild(strip);
            wrap.appendChild(shade);
            panel.appendChild(wrap);

            const fromCenter =
              side === "left"
                ? (foldsPerSide - 1 - i) / (foldsPerSide - 1)
                : i / (foldsPerSide - 1);

            strips.push({
              wrap,
              side,
              fromCenter,
              foldSign: valley ? 1 : -1,
            });
          }

          return { panel, strips };
        }

        const left = makeSide("left");
        const right = makeSide("right");
        stage.appendChild(left.panel);
        stage.appendChild(right.panel);
        document.body.appendChild(stage);

        const hold = 0.05;
        const duration = 2.1;
        const start = performance.now();

        const tick = (now) => {
          const t = (now - start) / 1000;
          if (t < hold) {
            requestAnimationFrame(tick);
            return;
          }

          const raw = Math.min(1, (t - hold) / duration);
          const e = drapeOpen(raw);

          const travel = mid + 80;
          left.panel.style.transform = `translateX(${-travel * e}px)`;
          right.panel.style.transform = `translateX(${travel * e}px)`;

          [...left.strips, ...right.strips].forEach((strip) => {
            const wave = Math.sin(strip.fromCenter * Math.PI);
            const foldAmp =
              Math.sin(e * Math.PI) * (22 + strip.fromCenter * 18);
            const rotateY = strip.foldSign * foldAmp * (0.35 + wave * 0.65);
            const z = Math.abs(Math.sin((rotateY * Math.PI) / 180)) * -28;
            const lead = (1 - strip.fromCenter) * 0.08;
            const localE = Math.min(1, Math.max(0, e + lead));
            const scaleX = 1 - localE * 0.12 * wave;

            strip.wrap.style.transform = `translateZ(${z}px) rotateY(${rotateY}deg) scaleX(${scaleX})`;
          });

          if (raw < 1) {
            requestAnimationFrame(tick);
          } else {
            stage.remove();
            onComplete();
          }
        };

        requestAnimationFrame(tick);
      }

      // --- curtain: Verlet cloth — thirds open, mesh seams hidden ---
      function runCurtain(sourceCanvas, _click, onComplete) {
        const prev = document.getElementById("shatter-layer");
        if (prev) prev.remove();

        const w = sourceCanvas.width;
        const h = sourceCanvas.height;
        const mid = w / 2;
        const renderScale = 2;

        const canvas = document.createElement("canvas");
        canvas.id = "shatter-layer";
        pinCanvas(canvas, w, h);
        document.body.appendChild(canvas);
        const ctx = canvas.getContext("2d");

        const off = document.createElement("canvas");
        off.width = Math.ceil(w * renderScale);
        off.height = Math.ceil(h * renderScale);
        const octx = off.getContext("2d");

        function drawTexturedTriangle(d0, d1, d2, s0, s1, s2) {
          // Expand clip slightly so adjacent tris overlap (kills hairline mesh)
          const cx = (d0.x + d1.x + d2.x) / 3;
          const cy = (d0.y + d1.y + d2.y) / 3;
          const pad = 1.15 * renderScale;
          const grow = (d) => {
            const dx = d.x - cx;
            const dy = d.y - cy;
            const len = Math.hypot(dx, dy) || 1;
            return { x: d.x + (dx / len) * pad, y: d.y + (dy / len) * pad };
          };
          const a = grow(d0);
          const b = grow(d1);
          const c = grow(d2);

          const denom =
            s0.u * (s1.v - s2.v) +
            s1.u * (s2.v - s0.v) +
            s2.u * (s0.v - s1.v);
          if (Math.abs(denom) < 1e-5) return;

          octx.save();
          octx.beginPath();
          octx.moveTo(a.x, a.y);
          octx.lineTo(b.x, b.y);
          octx.lineTo(c.x, c.y);
          octx.closePath();
          octx.clip();

          // Affine from original verts (not expanded) so UVs stay correct
          const m11 =
            (d0.x * (s1.v - s2.v) +
              d1.x * (s2.v - s0.v) +
              d2.x * (s0.v - s1.v)) /
            denom;
          const m12 =
            (d0.x * (s2.u - s1.u) +
              d1.x * (s0.u - s2.u) +
              d2.x * (s1.u - s0.u)) /
            denom;
          const m13 =
            (d0.x * (s1.u * s2.v - s2.u * s1.v) +
              d1.x * (s2.u * s0.v - s0.u * s2.v) +
              d2.x * (s0.u * s1.v - s1.u * s0.v)) /
            denom;
          const m21 =
            (d0.y * (s1.v - s2.v) +
              d1.y * (s2.v - s0.v) +
              d2.y * (s0.v - s1.v)) /
            denom;
          const m22 =
            (d0.y * (s2.u - s1.u) +
              d1.y * (s0.u - s2.u) +
              d2.y * (s1.u - s0.u)) /
            denom;
          const m23 =
            (d0.y * (s1.u * s2.v - s2.u * s1.v) +
              d1.y * (s2.u * s0.v - s0.u * s2.v) +
              d2.y * (s0.u * s1.v - s1.u * s0.v)) /
            denom;

          octx.setTransform(m11, m21, m12, m22, m13, m23);
          octx.drawImage(sourceCanvas, 0, 0);
          octx.restore();
        }

        function makeCloth(x0, x1) {
          // Soft hanging pleats (surplus fabric) — the good folds
          const cols = 18;
          const rows = 15;
          const panelW = x1 - x0;
          const pleats = 6;
          const vStep = h / (rows - 1);
          const restH = (panelW * 1.28) / (cols - 1);
          const particles = [];

          for (let j = 0; j < rows; j++) {
            const depth = j / (rows - 1);
            for (let i = 0; i < cols; i++) {
              const t = i / (cols - 1);
              const u = x0 + t * panelW;
              const v = j * vStep;
              const pleat = Math.sin(t * pleats * Math.PI);
              const x =
                x0 +
                t * panelW +
                pleat * (panelW / pleats) * 0.18 * (0.25 + 0.75 * depth);
              particles.push({
                x,
                y: v,
                ox: x,
                oy: v,
                px: x,
                py: v,
                pinned: j === 0,
                u,
                v,
              });
            }
          }

          for (let i = 0; i < cols; i++) {
            const p = particles[i];
            const t = i / (cols - 1);
            p.x = x0 + t * panelW;
            p.ox = p.x;
            p.px = p.x;
            p.y = 0;
            p.oy = 0;
            p.py = 0;
          }

          const idx = (i, j) => j * cols + i;
          const springs = [];
          for (let j = 0; j < rows; j++) {
            for (let i = 0; i < cols; i++) {
              if (i < cols - 1) {
                springs.push({ a: idx(i, j), b: idx(i + 1, j), len: restH });
              }
              if (j < rows - 1) {
                const a = particles[idx(i, j)];
                const b = particles[idx(i, j + 1)];
                springs.push({
                  a: idx(i, j),
                  b: idx(i, j + 1),
                  len: Math.hypot(b.ox - a.ox, b.oy - a.oy) || vStep,
                });
              }
            }
          }

          return { cols, rows, particles, springs, idx, x0, x1 };
        }

        const left = makeCloth(0, mid);
        const right = makeCloth(mid, w);

        const gravity = 0.38;
        const damp = 0.978;
        const settleFrames = 28;
        const hold = 0.35;
        const duration = 4.0;
        const travel = mid + 40;
        const start = performance.now();
        let smoothOpen = 0;
        let lastOpenE = 0;

        function stepCloth(cloth, pullDir, openE) {
          const { particles, springs } = cloth;
          // Extra drag when nearly still → kills jittery glitch folds on pauses
          const moving = Math.abs(openE - lastOpenE);
          const localDamp = moving < 0.0008 ? 0.92 : damp;

          for (let p of particles) {
            if (p.pinned) continue;
            let vx = (p.x - p.px) * localDamp;
            let vy = (p.y - p.py) * localDamp;
            // Clamp velocity so mesh can't invert into glitch folds
            const spd = Math.hypot(vx, vy);
            if (spd > 14) {
              vx = (vx / spd) * 14;
              vy = (vy / spd) * 14;
            }
            p.px = p.x;
            p.py = p.y;
            p.x += vx;
            p.y += vy + gravity;

            if (openE > 0) {
              const seamness =
                pullDir < 0
                  ? (p.u - cloth.x0) / Math.max(1, cloth.x1 - cloth.x0)
                  : (cloth.x1 - p.u) / Math.max(1, cloth.x1 - cloth.x0);
              const force = (0.35 + seamness * 1.4) * openE * openE;
              p.x += pullDir * force;
              p.y -= openE * 0.05 * seamness;
            }
          }

          for (let k = 0; k < 5; k++) {
            for (let s of springs) {
              const a = particles[s.a];
              const b = particles[s.b];
              const dx = b.x - a.x;
              const dy = b.y - a.y;
              const dist = Math.hypot(dx, dy) || 0.0001;
              // Cap stretch so cells can't collapse into glitches
              const maxLen = s.len * 1.55;
              const minLen = s.len * 0.45;
              const target = Math.min(maxLen, Math.max(minLen, s.len));
              const use = dist > maxLen || dist < minLen ? target : s.len;
              const diff = ((dist - use) / dist) * 0.5;
              const offX = dx * diff;
              const offY = dy * diff;
              if (!a.pinned) {
                a.x += offX;
                a.y += offY;
              }
              if (!b.pinned) {
                b.x -= offX;
                b.y -= offY;
              }
            }
          }

          const railShift = pullDir * openE * travel;
          for (let i = 0; i < cloth.cols; i++) {
            const p = particles[cloth.idx(i, 0)];
            p.x = p.ox + railShift;
            p.y = 0;
            p.px = p.x;
            p.py = p.y;
          }
        }

        function triArea(a, b, c) {
          return (b.x - a.x) * (c.y - a.y) - (b.y - a.y) * (c.x - a.x);
        }

        function drawCloth(cloth) {
          const { cols, rows, particles, idx } = cloth;
          const s = renderScale;
          for (let j = 0; j < rows - 1; j++) {
            for (let i = 0; i < cols - 1; i++) {
              const p00 = particles[idx(i, j)];
              const p10 = particles[idx(i + 1, j)];
              const p01 = particles[idx(i, j + 1)];
              const p11 = particles[idx(i + 1, j + 1)];

              const d00 = { x: p00.x * s, y: p00.y * s };
              const d10 = { x: p10.x * s, y: p10.y * s };
              const d01 = { x: p01.x * s, y: p01.y * s };
              const d11 = { x: p11.x * s, y: p11.y * s };

              // Skip collapsed / flipped tris — those flash as glitch folds
              if (Math.abs(triArea(d00, d10, d11)) > 0.5) {
                drawTexturedTriangle(
                  d00,
                  d10,
                  d11,
                  { u: p00.u, v: p00.v },
                  { u: p10.u, v: p10.v },
                  { u: p11.u, v: p11.v },
                );
              }
              if (Math.abs(triArea(d00, d11, d01)) > 0.5) {
                drawTexturedTriangle(
                  d00,
                  d11,
                  d01,
                  { u: p00.u, v: p00.v },
                  { u: p11.u, v: p11.v },
                  { u: p01.u, v: p01.v },
                );
              }
            }
          }
        }

        for (let i = 0; i < settleFrames; i++) {
          stepCloth(left, -1, 0);
          stepCloth(right, 1, 0);
        }
        lastOpenE = 0;

        const tick = (now) => {
          const t = (now - start) / 1000;
          const raw = t < hold ? 0 : Math.min(1, (t - hold) / duration);
          const target = curtainOpen(raw);
          const catchUp = Math.abs(target - smoothOpen) < 0.002 ? 1 : 0.12;
          smoothOpen += (target - smoothOpen) * catchUp;
          if (target === 0) smoothOpen = 0;
          const openE = smoothOpen;

          ctx.setTransform(1, 0, 0, 1, 0, 0);
          ctx.clearRect(0, 0, w, h);

          if (openE <= 0.001) {
            ctx.drawImage(sourceCanvas, 0, 0);
          } else {
            stepCloth(left, -1, openE);
            stepCloth(right, 1, openE);
            lastOpenE = openE;

            octx.setTransform(1, 0, 0, 1, 0, 0);
            octx.clearRect(0, 0, off.width, off.height);
            drawCloth(left);
            drawCloth(right);

            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = "high";
            ctx.drawImage(off, 0, 0, w, h);
          }

          if (raw < 1 || Math.abs(target - smoothOpen) > 0.002) {
            requestAnimationFrame(tick);
          } else {
            canvas.remove();
            onComplete();
          }
        };

        requestAnimationFrame(tick);
      }

      // --- flip: horizontal rotateY; front = old page, back = destination ---
      function runFlip(frontShot, backShot, onComplete, existingStage) {
        const prev = document.getElementById("shatter-layer");
        if (prev && prev !== existingStage) prev.remove();

        const w = frontShot.width;
        const h = frontShot.height;

        const stage = existingStage || document.createElement("div");
        stage.id = "shatter-layer";
        stage.style.cssText = [
          "position:fixed",
          "top:0",
          "left:0",
          `width:${w}px`,
          `height:${h}px`,
          "z-index:9999",
          "pointer-events:none",
          "background:#000",
          "perspective:1600px",
          "perspective-origin:50% 50%",
          "overflow:hidden",
        ].join(";");
        if (!existingStage) document.body.appendChild(stage);

        const card = stage.querySelector("[data-flip-card]") || document.createElement("div");
        card.setAttribute("data-flip-card", "1");
        card.style.cssText = [
          "position:relative",
          `width:${w}px`,
          `height:${h}px`,
          "transform-style:preserve-3d",
          "transform-origin:50% 50%",
          "will-change:transform",
          "transform:rotateY(0deg)",
        ].join(";");
        if (!card.parentNode) stage.appendChild(card);

        function face(shot, isBack) {
          const c = document.createElement("canvas");
          c.width = w;
          c.height = h;
          c.getContext("2d").drawImage(shot, 0, 0);
          c.setAttribute("data-flip-face", isBack ? "back" : "front");
          c.style.cssText = [
            "position:absolute",
            "inset:0",
            `width:${w}px`,
            `height:${h}px`,
            "display:block",
            "backface-visibility:hidden",
            "-webkit-backface-visibility:hidden",
            isBack ? "transform:rotateY(180deg)" : "transform:rotateY(0deg)",
          ].join(";");
          return c;
        }

        // Ensure front exists; attach back when provided
        if (!card.querySelector('[data-flip-face="front"]')) {
          card.appendChild(face(frontShot, false));
        }
        const oldBack = card.querySelector('[data-flip-face="back"]');
        if (oldBack) oldBack.remove();
        card.appendChild(face(backShot, true));

        const hold = 0.04;
        const duration = 1.05;
        const start = performance.now();

        const tick = (now) => {
          const t = (now - start) / 1000;
          if (t < hold) {
            requestAnimationFrame(tick);
            return;
          }
          const e = easeInOutCubic(Math.min(1, (t - hold) / duration));
          card.style.transform = `rotateY(${e * 180}deg)`;

          if (t < hold + duration) {
            requestAnimationFrame(tick);
          } else {
            stage.remove();
            onComplete();
          }
        };

        requestAnimationFrame(tick);
      }

      // Mount flip stage showing ONLY the front face (seamless with freeze)
      function mountFlipFront(frontShot) {
        const w = frontShot.width;
        const h = frontShot.height;
        const stage = document.createElement("div");
        stage.id = "shatter-layer";
        stage.style.cssText = [
          "position:fixed",
          "top:0",
          "left:0",
          `width:${w}px`,
          `height:${h}px`,
          "z-index:9999",
          "pointer-events:none",
          "background:#000",
          "perspective:1600px",
          "perspective-origin:50% 50%",
          "overflow:hidden",
        ].join(";");

        const card = document.createElement("div");
        card.setAttribute("data-flip-card", "1");
        card.style.cssText = [
          "position:relative",
          `width:${w}px`,
          `height:${h}px`,
          "transform-style:preserve-3d",
          "transform-origin:50% 50%",
          "transform:rotateY(0deg)",
        ].join(";");

        const front = document.createElement("canvas");
        front.width = w;
        front.height = h;
        front.getContext("2d").drawImage(frontShot, 0, 0);
        front.setAttribute("data-flip-face", "front");
        front.style.cssText = [
          "position:absolute",
          "inset:0",
          `width:${w}px`,
          `height:${h}px`,
          "display:block",
          "backface-visibility:hidden",
          "-webkit-backface-visibility:hidden",
        ].join(";");

        card.appendChild(front);
        stage.appendChild(card);
        document.body.appendChild(stage);
        return stage;
      }

      const TRANSITION_RUNNERS = {
        shatter: runShatter,
        crumble: runCrumble,
        crumble2: runCrumble2,
        fall: runFall,
        fall2: runFall2,
        shrink: runShrink,
        drape: runDrape,
        curtain: runCurtain,
        flip: runFlip,
        ripple: runRipple,
        ripple2: runRipple2,
        clock: runClock,
      };

      async function transitionTo({ type, click, onReveal, onDone }) {
        // Flip needs both faces: old page + destination
        if (type === "flip") {
          const front = await screenshotViewport();

          // 1) Freeze current page
          const freeze = document.createElement("canvas");
          freeze.id = "shatter-overlay";
          pinCanvas(freeze, front.width, front.height);
          freeze.style.zIndex = "10000";
          freeze.getContext("2d").drawImage(front, 0, 0);
          document.body.appendChild(freeze);
          await nextFrame();

          // 2) Swap route under the freeze
          onReveal();
          window.scrollTo(0, 0);
          await nextFrame();
          await nextFrame();

          // 3) Put flip stage with FRONT still showing (no black gap)
          const stage = mountFlipFront(front);
          freeze.remove();
          await nextFrame();

          // 4) Capture destination while front face still covers the screen
          let back;
          try {
            back = await screenshotViewport();
          } catch (err) {
            stage.remove();
            throw err;
          }

          // 5) Attach back face and animate the flip
          runFlip(front, back, onDone, stage);
          return;
        }

        const runner = TRANSITION_RUNNERS[type] || runShatter;

        // 1) Screenshot the viewport
        const shot = await screenshotViewport();

        // 2) Show screenshot over the current page
        const overlay = document.createElement("canvas");
        overlay.id = "shatter-overlay";
        pinCanvas(overlay, shot.width, shot.height);
        overlay.getContext("2d").drawImage(shot, 0, 0);
        document.body.appendChild(overlay);
        await nextFrame();

        // 3) Go to the next page underneath
        onReveal();
        window.scrollTo(0, 0);
        await nextFrame();

        // 4) Run the chosen transition on the screenshot
        overlay.remove();
        runner(shot, click, onDone);
      }

      function clickPointFromEvent(e) {
        if (!e) return null;
        const w = document.documentElement.clientWidth;
        const h = document.documentElement.clientHeight;
        return {
          x: Math.min(w, Math.max(0, e.clientX)),
          y: Math.min(h, Math.max(0, e.clientY)),
        };
      }

      // ---------------------------------------------------------
      // UI
      // ---------------------------------------------------------
      const TransitionPicker = ({ type, onChange, locked, types }) => (
        <div className="fixed bottom-14 left-2 z-[10002] flex flex-col gap-0 pointer-events-none text-[11px] leading-tight font-y2k">
          <span className="text-y2k-yellow bg-black px-1 mb-1 w-fit">fx:</span>
          {(types || TRANSITION_TYPES).map((name) => (
            <button
              key={name}
              type="button"
              disabled={locked}
              onClick={() => onChange(name)}
              className={`pointer-events-auto text-left y2k-link disabled:pointer-events-none bg-y2k-silver/90 px-1 ${
                type === name ? "active" : ""
              }`}
            >
              {type === name ? `► ${name}` : name}
            </button>
          ))}
        </div>
      );

      const CartBar = ({ count, onHome, onCart, locked }) => (
        <header className="w-full bg-[#000080] text-y2k-yellow px-2 py-1 flex items-center justify-between font-anell text-anell leading-none border-b border-black">
          <button
            type="button"
            disabled={locked}
            onClick={onHome}
            className="pointer-events-auto text-y2k-yellow underline disabled:pointer-events-none hover:text-white"
          >
            ★ anell ★
          </button>
          <button
            type="button"
            disabled={locked}
            onClick={onCart}
            className="pointer-events-auto text-y2k-yellow underline disabled:pointer-events-none hover:text-white text-[1.1rem]"
          >
            cart ({count})
          </button>
        </header>
      );

      const ImageGrid = ({ onSelect, locked }) => (
        <main className="w-full h-full min-h-full py-4 px-2 flex flex-col">
          <p className="text-center text-y2k-navy font-y2k text-sm mb-2 flex items-center justify-center gap-2 flex-wrap">
            <span className="y2k-blink text-red-600 font-bold">new!</span>
            <span>handmade rings · est. 2001</span>
            <span className="y2k-blink text-red-600 font-bold">new!</span>
          </p>
          <hr className="y2k-hr" />
          <div className="grid grid-cols-2 gap-6 py-2 px-2">
            {PRODUCTS.map((product) => (
              <button
                key={product.id}
                type="button"
                disabled={locked}
                onClick={(e) => onSelect(product, e)}
                className="group flex w-full flex-col items-stretch gap-2 bg-transparent text-left disabled:pointer-events-none"
              >
                <img
                  src={`./gallery/lofi/${String(product.id).padStart(2, "0")}.jpg`}
                  alt={product.alt}
                  className="y2k-photo border border-black"
                />
                <span className="y2k-link text-base leading-tight text-left w-full group-hover:text-[#ff00ff]">
                  {product.label}
                </span>
              </button>
            ))}
          </div>
          <div className="mt-auto">
            <hr className="y2k-hr" />
            <p className="text-center font-y2k text-xs text-black mt-2">
              © 2001–2003 anell web shop · no rights reserved ·{" "}
              <span className="text-y2k-link underline">guestbook</span>
            </p>
          </div>
        </main>
      );

      const VariantModal = ({ size, locked, onPick, onClose }) => (
        <div
          className="fixed inset-0 z-[10050] flex items-center justify-center bg-y2k-navy/80 px-4"
          onClick={onClose}
        >
          <div
            className="flex w-full max-w-xl flex-col gap-4 border border-black bg-y2k-face p-4"
            onClick={(e) => e.stopPropagation()}
          >
            <p className="text-center font-anell text-anell text-y2k-navy bg-y2k-yellow border border-black py-1">
              size {size} · choose type
            </p>
            <div className="grid grid-cols-2 gap-4">
              {RING_VARIANTS.map((v) => (
                <button
                  key={v.id}
                  type="button"
                  disabled={locked}
                  onClick={() => onPick(v)}
                  className="group flex flex-col items-center gap-2 disabled:pointer-events-none"
                >
                  <img
                    src={v.src}
                    alt={v.name}
                    className="block w-full h-auto object-contain border border-black"
                  />
                  <span className="y2k-link">{v.name}</span>
                </button>
              ))}
            </div>
            <button
              type="button"
              disabled={locked}
              onClick={onClose}
              className="y2k-btn mx-auto disabled:pointer-events-none"
            >
              close
            </button>
          </div>
        </div>
      );

      const ProductPage = ({ product, onAdd, locked }) => {
        const pack = product.pack || 1;
        const [picks, setPicks] = React.useState([]);
        const [pendingSize, setPendingSize] = React.useState(null);

        const packLabel =
          pack === 1 ? "one ring" : `pack of ${pack}`;

        const handleVariantPick = (variant) => {
          if (pendingSize == null) return;
          setPicks((prev) => {
            if (prev.length >= pack) return prev;
            return [
              ...prev,
              {
                size: pendingSize,
                variant: variant.name,
                variantId: variant.id,
              },
            ];
          });
          setPendingSize(null);
        };

        const handleAdd = () => {
          if (picks.length !== pack) return;
          onAdd({ pack, picks });
        };

        const slotLabel = (i) => {
          const p = picks[i];
          if (!p) return `ring ${i + 1} · choose size`;
          return `ring ${i + 1} · ${p.variant} · size ${p.size}`;
        };

        return (
          <main className="w-full py-4 px-2">
            <div className="mx-auto w-full max-w-2xl flex flex-col gap-4 p-4">
              <img
                src={product.src}
                alt={product.alt}
                className="block w-full h-auto object-contain border border-black mx-auto"
              />

              <hr className="y2k-hr" />

              <div className="flex flex-col gap-3 font-y2k text-base text-black">
                <p className="font-anell text-anell text-y2k-navy text-center bg-y2k-yellow border border-black py-1">
                  {packLabel}
                </p>

                <p className="font-bold text-y2k-navy">1. your rings:</p>
                <div className="flex flex-col gap-1 border border-black p-2 bg-[#ffffcc]">
                  {Array.from({ length: pack }).map((_, i) => (
                    <p
                      key={i}
                      className={picks[i] ? "text-black" : "text-gray-500"}
                    >
                      · {slotLabel(i)}
                    </p>
                  ))}
                </div>

                {picks.length < pack && (
                  <>
                    <p className="font-bold text-y2k-navy">2. pick a size:</p>
                    <div className="flex flex-wrap gap-2">
                      {SIZES.map((s) => (
                        <button
                          key={s}
                          type="button"
                          disabled={locked}
                          onClick={() => setPendingSize(s)}
                          className="y2k-btn disabled:pointer-events-none"
                        >
                          {s}
                        </button>
                      ))}
                    </div>
                  </>
                )}

                <button
                  type="button"
                  disabled={locked || picks.length !== pack}
                  onClick={handleAdd}
                  className="y2k-btn mt-2 bg-y2k-lime disabled:pointer-events-none disabled:opacity-40 text-left w-fit"
                >
                  {picks.length === pack
                    ? `>>> add ${packLabel} · 30.- <<<`
                    : `choose ${pack - picks.length} more`}
                </button>
              </div>
            </div>

            {pendingSize != null && (
              <VariantModal
                size={pendingSize}
                locked={locked}
                onPick={handleVariantPick}
                onClose={() => setPendingSize(null)}
              />
            )}
          </main>
        );
      };

      const CartPage = ({ items, onClear, locked }) => {
        const [copied, setCopied] = React.useState(false);

        const lines = items.flatMap((order) =>
          order.picks.map(
            (p, i) =>
              `pack${order.pack} #${i + 1} ${p.variant} size ${p.size}`,
          ),
        );
        const message = items.length
          ? `anell order: ${lines.join(", ")} address: [your address]`
          : "";

        const handleCopy = () => {
          if (!message) return;
          if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(message).then(() => {
              setCopied(true);
              setTimeout(() => setCopied(false), 2000);
            });
          }
        };

        const handlePay = (order) => {
          if (!stripeLinkReady(order.pack)) {
            alert(`stripe link for pack of ${order.pack} coming soon`);
            return;
          }
          const link = STRIPE_LINKS[order.pack];
          const ref = encodeURIComponent(
            encodeOrderRef(order.pack, order.picks),
          );
          window.open(
            `${link}?client_reference_id=${ref}`,
            "_blank",
            "noopener,noreferrer",
          );
        };

        return (
          <main className="w-full py-4 px-2">
            <div className="mx-auto w-full max-w-xl flex flex-col gap-4 border border-black bg-white p-4 font-y2k text-base text-black">
              <p className="font-anell text-anell text-center bg-y2k-yellow border border-black py-1 text-y2k-navy">
                ★ your cart ★
              </p>
              {items.length === 0 ? (
                <p className="text-center text-gray-600">
                  cart empty ·{" "}
                  <span className="y2k-link">go shop something!</span>
                </p>
              ) : (
                <>
                  {items.map((order, oi) => (
                    <div
                      key={oi}
                      className="flex flex-col gap-2 border border-black p-3 bg-y2k-face"
                    >
                      <p className="font-bold text-y2k-navy">
                        pack of {order.pack}
                      </p>
                      {order.picks.map((p, i) => (
                        <p key={i} className="text-sm">
                          · {p.variant} · size {p.size}
                        </p>
                      ))}
                      <button
                        type="button"
                        disabled={locked}
                        onClick={() => handlePay(order)}
                        className="y2k-btn w-fit bg-y2k-lime disabled:pointer-events-none"
                      >
                        {stripeLinkReady(order.pack)
                          ? `pay with stripe · pack of ${order.pack}`
                          : `stripe pack of ${order.pack} soon`}
                      </button>
                    </div>
                  ))}
                  <p className="text-sm">
                    or twint <span className="text-y2k-link">{TWINT_NUMBER}</span>
                  </p>
                  <div className="flex flex-wrap gap-2">
                    <button
                      type="button"
                      disabled={locked}
                      onClick={handleCopy}
                      className="y2k-btn disabled:pointer-events-none"
                    >
                      {copied ? "copied!" : "copy order text"}
                    </button>
                    <button
                      type="button"
                      disabled={locked}
                      onClick={onClear}
                      className="y2k-btn disabled:pointer-events-none"
                    >
                      clear cart
                    </button>
                  </div>
                </>
              )}
            </div>
          </main>
        );
      };

      const App = () => {
        const [view, setView] = React.useState("home");
        const [product, setProduct] = React.useState(null);
        const [cart, setCart] = React.useState([]);
        const [locked, setLocked] = React.useState(false);
        const TRANSITION_CYCLE = ["fall", "clock", "ripple2"];
        const [transitionType, setTransitionType] =
          React.useState("fall");
        const cycleRef = React.useRef(0);

        React.useEffect(() => {
          document.body.classList.remove("bg-ring-open", "bg-cart");
          if (view === "product") document.body.classList.add("bg-ring-open");
          if (view === "cart") document.body.classList.add("bg-cart");
          return () =>
            document.body.classList.remove("bg-ring-open", "bg-cart");
        }, [view]);

        const navigate = React.useCallback(
          async (nextView, nextProduct, event) => {
            if (locked) return;
            if (nextView === view && nextProduct?.id === product?.id) return;

            const click = clickPointFromEvent(event);
            // For now only fall — keep TRANSITION_CYCLE for later
            const type = "fall";
            cycleRef.current += 1;
            setTransitionType(type);
            setLocked(true);
            try {
              await transitionTo({
                type,
                click,
                onReveal: () => {
                  setView(nextView);
                  setProduct(nextProduct ?? null);
                },
                onDone: () => {
                  setLocked(false);
                },
              });
            } catch (err) {
              console.error(err);
              setView(nextView);
              setProduct(nextProduct ?? null);
              setLocked(false);
            }
          },
          [locked, view, product],
        );

        return (
          <div className="relative min-h-screen text-y2k-link">
            <div className="mx-auto w-full max-w-[820px] min-h-screen border border-black bg-white flex flex-col">
              <CartBar
                count={cart.length}
                locked={locked}
                onHome={(e) => navigate("home", null, e)}
                onCart={(e) => navigate("cart", null, e)}
              />

              <div className="flex-1 flex flex-col bg-white p-2">
                {view === "home" && (
                  <ImageGrid
                    locked={locked}
                    onSelect={(p, e) => navigate("product", p, e)}
                  />
                )}
                {view === "product" && product && (
                  <ProductPage
                    key={product.id}
                    product={product}
                    locked={locked}
                    onAdd={(order) =>
                      setCart((prev) => [...prev, order])
                    }
                  />
                )}
                {view === "cart" && (
                  <CartPage
                    items={cart}
                    locked={locked}
                    onClear={() => setCart([])}
                  />
                )}
              </div>

            </div>

            <TransitionPicker
              type={transitionType}
              onChange={() => {}}
              locked={locked}
              types={["fall"]}
            />
          </div>
        );
      };

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    </script>
  </body>
</html>
