    <style>
      @font-face {

      html {

      body {
        font-family: "CirrusCumulus", "Courier New", Courier, monospace;
        font-size: 1.25rem;
        font-weight: 700;
        line-height: 1.2;
        overscroll-behavior: none;
        overflow-x: clip;
        color: #0000ee;

        text-shadow: 0.4px 0 0 currentColor, -0.4px 0 0 currentColor;

        background-image: url("./assets/diamond-plate.jpg");

      body.bg-cart {
        background-image: url("./assets/welder.png");
        background-repeat: repeat;

        background-size: 360px 195px;

        border-width: 2px;
        border-color: #ffffff #404040 #404040 #ffffff;
        background: #c0c0c0;
        color: #000000;

        font-family: inherit;
        box-shadow: inset -1px -1px 0 #808080, inset 1px 1px 0 #dfdfdf;

  <body class="text-y2k-link antialiased">
    <div id="root"></div>

    <script type="text/babel">
      const TWINT_NUMBER = "+41 78 985 88 88";
      // One Stripe link per product (single / pack of 2 / pack of 3)
      const STRIPE_LINKS = {
        1: "https://buy.stripe.com/7sYaEX4KT0DDgHmgKsaEE01",
        2: "https://buy.stripe.com/REPLACE_PACK_OF_2",
        3: "https://buy.stripe.com/REPLACE_PACK_OF_3",
      };

      // Two ring types available for every size
      const RING_VARIANTS = [
        { id: "a", name: "001", src: "./ring1/1.webp" },
        { id: "b", name: "002", src: "./ring2/1.webp" },
      ];

      const PRODUCTS = [
        { id: 1, src: "./gallery/01.png", alt: "one ring", name: "001", label: "one ring", pack: 1 },
        { id: 2, src: "./gallery/02.png", alt: "pack of 2", name: "002", label: "pack of 2", pack: 2 },
        { id: 3, src: "./gallery/03.png", alt: "pack of 3", name: "003", label: "pack of 3", pack: 3 },
      ];

      const SIZES = [48, 50, 52, 54, 56, 58, 60, 62, 64, 66];

      function encodeOrderRef(pack, picks) {
        // e.g. pack3_001-52_002-54_001-56  (fits Stripe client_reference_id)
        const parts = picks.map((p) => `${p.variant}-${p.size}`).join("_");
        return `pack${pack}_${parts}`.slice(0, 200);
      }

      function stripeLinkReady(pack) {
        const link = STRIPE_LINKS[pack];
        return Boolean(link && !link.includes("REPLACE_"));
      }

      // ---------------------------------------------------------
      // Page transitions
      //   shatter — triangles fall off screen
      //   crumble — paper folds along creases, then gathers
      //   crumble2 — heavier morph / swirl into a wad
      //   fall    — whole sheet tips toward you
      //   fall2   — push over at click; stands on slider, tips away & falls out
      //   shrink  — viewport shrinks into the click and vanishes
      //   drape   — static fold panels open outward
      //   curtain — physics cloth curtains on canvas
      //   flip    — horizontal card flip; back is destination, void is black
      //   ripple  — water-like radial waves from click
      //   ripple2 — simple expanding circle reveal from click
      //   clock   — clockwise pie wipe around the click
      // ---------------------------------------------------------
      const TRANSITION_TYPES = [
        "shatter",
        "crumble",
        "crumble2",
        "fall",
        "fall2",
        "shrink",
        "drape",
        "curtain",
        "flip",
        "ripple",
        "ripple2",
        "clock",
      ];

      function easeInCubic(t) {
        return t * t * t;
      }

      function easeOutCubic(t) {
        return 1 - Math.pow(1 - t, 3);
      }

      function easeInOutCubic(t) {
        return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
      }

      // Two ease-out bursts, pauses, then final exit — shared by drape + curtain
      function drapeOpen(t) {
        const t1 = 0.32;
        const p1 = 0.38;
        const t2 = 0.58;
        const p2 = 0.68;
        const t3 = 1.0;
        if (t <= t1) return easeOutCubic(t / t1) * 0.34;
        if (t <= p1) return 0.34;
        if (t <= t2) {
          const u = (t - p1) / (t2 - p1);
          return 0.34 + easeOutCubic(u) * 0.36;
        }
        if (t <= p2) return 0.7;
        const u = (t - p2) / (t3 - p2);
        return 0.7 + easeInOutCubic(u) * 0.3;
      }

      // Ease in soft, then brake hard into the stop
      function easeInThenSnapOut(u) {
        u = Math.min(1, Math.max(0, u));
        if (u < 0.55) {
          const x = u / 0.55;
          return 0.55 * x * x * x; // long soft ease-in
        }
        const x = (u - 0.55) / 0.45;
        return 0.55 + 0.45 * (1 - Math.pow(1 - x, 4)); // quick settle
      }

      // Curtain: ease into burst → snap stop → pause → repeat → exit
      function curtainOpen(t) {
        // move, pause, move, pause, exit
        const a1 = 0.22; // end first burst
        const p1 = 0.34; // end first pause
        const a2 = 0.56;
        const p2 = 0.68;
        if (t <= a1) return easeInThenSnapOut(t / a1) * 0.18;
        if (t <= p1) return 0.18;
        if (t <= a2) return 0.18 + easeInThenSnapOut((t - p1) / (a2 - p1)) * 0.22;
        if (t <= p2) return 0.4;
        return 0.4 + easeInThenSnapOut((t - p2) / (1 - p2)) * 0.6;
      }

      function nextFrame() {
        return new Promise((r) =>
          requestAnimationFrame(() => requestAnimationFrame(r)),
        );
      }

      function pinCanvas(canvas, w, h) {
        canvas.width = w;
        canvas.height = h;
        canvas.style.cssText = [
          "position:fixed",
          "top:0",
          "left:0",
          `width:${w}px`,
          `height:${h}px`,
          "z-index:9999",
          "pointer-events:none",
          "display:block",
          "margin:0",
          "padding:0",
          "border:0",
        ].join(";");
      }

      async function screenshotViewport() {
        const w = document.documentElement.clientWidth;
        const h = document.documentElement.clientHeight;
        const scrollX = window.scrollX;
        const scrollY = window.scrollY;

        const shot = await htmlToImage.toCanvas(document.body, {
          pixelRatio: 1,
          width: w,
          height: h,
          canvasWidth: w,
          canvasHeight: h,
          backgroundColor: "#8a8a8a",
          style: {
            transform: `translate(${-scrollX}px, ${-scrollY}px)`,
            transformOrigin: "top left",
          },
          filter: (node) => {
            if (!node || typeof node.id !== "string") return true;
            return (
              node.id !== "shatter-layer" &&
              node.id !== "shatter-freeze" &&
              node.id !== "shatter-overlay"
            );
          },
        });

        const out = document.createElement("canvas");
        out.width = w;
        out.height = h;
        const ctx = out.getContext("2d");
        ctx.fillStyle = "#8a8a8a";
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(shot, 0, 0);
        return out;
      }

      function buildTriangles(w, h, cols, rows, jitter = 0.9) {
        const grid = [];
        for (let y = 0; y <= rows; y++) {
          const line = [];
          for (let x = 0; x <= cols; x++) {
            let px = (x / cols) * w;
            let py = (y / rows) * h;
            const edge = x === 0 || y === 0 || x === cols || y === rows;
            if (!edge) {
              px += (Math.random() - 0.5) * (w / cols) * jitter;
              py += (Math.random() - 0.5) * (h / rows) * jitter;
            }
            line.push([px, py]);
          }
          grid.push(line);
        }

        const tris = [];
        for (let y = 0; y < rows; y++) {
          for (let x = 0; x < cols; x++) {
            const a = grid[y][x];
            const b = grid[y][x + 1];
            const c = grid[y + 1][x];
            const d = grid[y + 1][x + 1];
            if (Math.random() > 0.5) {
              tris.push([a, b, d], [a, d, c]);
            } else {
              tris.push([a, b, c], [b, d, c]);
            }
          }
        }
        return tris;
      }

      function drawPiece(ctx, sourceCanvas, piece, x, y, rot, scale) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(rot);
        ctx.scale(scale, scale);
        ctx.beginPath();
        ctx.moveTo(piece.local[0][0], piece.local[0][1]);
        ctx.lineTo(piece.local[1][0], piece.local[1][1]);
        ctx.lineTo(piece.local[2][0], piece.local[2][1]);
        ctx.closePath();
        ctx.clip();
        ctx.drawImage(sourceCanvas, -piece.cx, -piece.cy);
        ctx.restore();
      }

      // --- shatter: big triangles fall off the bottom ---
      function runShatter(sourceCanvas, _click, onComplete) {
        const prev = document.getElementById("shatter-layer");
        if (prev) prev.remove();

        const w = sourceCanvas.width;
        const h = sourceCanvas.height;
        const canvas = document.createElement("canvas");
        canvas.id = "shatter-layer";
        pinCanvas(canvas, w, h);
        document.body.appendChild(canvas);
        const ctx = canvas.getContext("2d");

        const pieces = buildTriangles(w, h, 5, 3).map((tri) => {
          const [a, b, c] = tri;
          const cx = (a[0] + b[0] + c[0]) / 3;
          const cy = (a[1] + b[1] + c[1]) / 3;
          const side = cx < w / 2 ? -1 : 1;
          return {
            cx,
            cy,
            local: [
              [a[0] - cx, a[1] - cy],
              [b[0] - cx, b[1] - cy],
              [c[0] - cx, c[1] - cy],
            ],
            tx: side * (80 + Math.random() * 280) + (Math.random() - 0.5) * 160,
            ty: h - cy + 280 + Math.random() * 520,
            rot: (Math.random() - 0.5) * Math.PI * 2.4,
            delay: Math.random() * 0.2,
          };
        });

        const hold = 0.06;
        const duration = 1.55;
        const start = performance.now();
        ctx.drawImage(sourceCanvas, 0, 0);

        const tick = (now) => {
          const t = (now - start) / 1000;
          ctx.setTransform(1, 0, 0, 1, 0, 0);
          ctx.clearRect(0, 0, w, h);

          if (t < hold) {
            ctx.drawImage(sourceCanvas, 0, 0);
            requestAnimationFrame(tick);
            return;
          }

          pieces.forEach((piece) => {
            const local = Math.max(0, t - hold - piece.delay);
            const e = easeInCubic(Math.min(1, local / duration));
            drawPiece(
              ctx,
              sourceCanvas,
              piece,
              piece.cx + piece.tx * e,
              piece.cy + piece.ty * e,
              piece.rot * e,
              1,
            );
          });

          if (t < hold + duration + 0.15) {
            requestAnimationFrame(tick);
          } else {
            canvas.remove();
            onComplete();
          }
        };

        requestAnimationFrame(tick);
      }

      // Shared crumple sheet renderer (mesh seams hidden via overlap, optional shade)
      function makeCrumbleSheet(sourceCanvas, click, opts) {
        const prev = document.getElementById("shatter-layer");
        if (prev) prev.remove();

        const w = sourceCanvas.width;
        const h = sourceCanvas.height;
        const canvas = document.createElement("canvas");
        canvas.id = "shatter-layer";
        pinCanvas(canvas, w, h);
        document.body.appendChild(canvas);
        const ctx = canvas.getContext("2d");

        const ox =
          click && Number.isFinite(click.x)
            ? Math.min(w, Math.max(0, click.x))
            : w / 2;
        const oy =
          click && Number.isFinite(click.y)
            ? Math.min(h, Math.max(0, click.y))
            : h / 2;

        const cols = opts.cols;
        const rows = opts.rows;
        const seed = Math.random() * 1000;
        const foldAxis = seed * 0.017;
        const foldCount = 3 + Math.floor(seed % 3);
        const n1 = (i, j) =>
          Math.sin(i * 0.55 + j * 0.32 + seed) *
          Math.cos(j * 0.4 + seed * 0.3);
        const n2 = (i, j) => Math.sin(i * 0.25 + j * 0.7 + seed * 1.7 + 1.2);
        const n3 = (i, j) => Math.sin((i + j) * 0.35 + seed * 0.8 + 0.4);
        const n4 = (i, j) => Math.cos(i * 0.7 - j * 0.4 + seed * 1.1);

        const grid = [];
        for (let j = 0; j <= rows; j++) {
          const row = [];
          for (let i = 0; i <= cols; i++) {
            const x0 = (i / cols) * w;
            const y0 = (j / rows) * h;
            const u = x0 / w;
            const vv = y0 / h;
            const along = u * Math.cos(foldAxis) + vv * Math.sin(foldAxis);
            const across = -u * Math.sin(foldAxis) + vv * Math.cos(foldAxis);
            row.push({
              x0,
              y0,
              i,
              j,
              wr1: n1(i, j),
              wr2: n2(i, j),
              wr3: n3(i, j),
              wr4: n4(i, j),
              crease: Math.sin(along * foldCount * Math.PI + seed),
              crease2: Math.sin(across * 2.2 * Math.PI + seed * 0.6),
            });
          }
          grid.push(row);
        }

        const faces = [];
        for (let j = 0; j < rows; j++) {
          for (let i = 0; i < cols; i++) {
            const a = grid[j][i];
            const b = grid[j][i + 1];
            const c = grid[j + 1][i];
            const d = grid[j + 1][i + 1];
            const area0 = Math.abs(
              (b.x0 - a.x0) * (c.y0 - a.y0) - (c.x0 - a.x0) * (b.y0 - a.y0),
            );
            if ((i + j) % 2 === 0) {
              faces.push([a, b, d, area0 * 0.5], [a, d, c, area0 * 0.5]);
            } else {
              faces.push([a, b, c, area0 * 0.5], [b, d, c, area0 * 0.5]);
            }
          }
        }

        const wadR = Math.min(w, h) * opts.wadScale + (seed % 20);
        const cellW = w / cols;
        const cellH = h / rows;
        const crumpleVertex = opts.crumpleVertex({
          ox,
          oy,
          wadR,
          foldAxis,
          cellW,
          cellH,
        });

        function drawSheetTri(p0, p1, p2, q0, q1, q2, shade) {
          // Skip flipped / collapsed faces — those flash as triangles through the plane
          const restSign =
            (p1.x0 - p0.x0) * (p2.y0 - p0.y0) - (p2.x0 - p0.x0) * (p1.y0 - p0.y0);
          const nowSign =
            (q1.x - q0.x) * (q2.y - q0.y) - (q2.x - q0.x) * (q1.y - q0.y);
          if (restSign * nowSign <= 0) return;
          if (Math.abs(nowSign) < 1.5) return;

          // Tiny expand only — too much pad = faces stab through neighbors
          const cx = (q0.x + q1.x + q2.x) / 3;
          const cy = (q0.y + q1.y + q2.y) / 3;
          const pad = Math.min(opts.triPad, 0.55);
          const grow = (q) => {
            const dx = q.x - cx;
            const dy = q.y - cy;
            const len = Math.hypot(dx, dy) || 1;
            return { x: q.x + (dx / len) * pad, y: q.y + (dy / len) * pad };
          };
          const d0 = grow(q0);
          const d1 = grow(q1);
          const d2 = grow(q2);

          const x0 = p0.x0;
          const y0 = p0.y0;
          const x1 = p1.x0;
          const y1 = p1.y0;
          const x2 = p2.x0;
          const y2 = p2.y0;
          const u0 = q0.x;
          const v0 = q0.y;
          const u1 = q1.x;
          const v1 = q1.y;
          const u2 = q2.x;
          const v2 = q2.y;

          const delta = x0 * (y1 - y2) + x1 * (y2 - y0) + x2 * (y0 - y1);
          if (Math.abs(delta) < 0.0001) return;

          const ma = (u0 * (y1 - y2) + u1 * (y2 - y0) + u2 * (y0 - y1)) / delta;
          const mb = (u0 * (x2 - x1) + u1 * (x0 - x2) + u2 * (x1 - x0)) / delta;
          const mc =
            (u0 * (x1 * y2 - x2 * y1) +
              u1 * (x2 * y0 - x0 * y2) +
              u2 * (x0 * y1 - x1 * y0)) /
            delta;
          const md = (v0 * (y1 - y2) + v1 * (y2 - y0) + v2 * (y0 - y1)) / delta;
          const me = (v0 * (x2 - x1) + v1 * (x0 - x2) + v2 * (x1 - x0)) / delta;
          const mf =
            (v0 * (x1 * y2 - x2 * y1) +
              v1 * (x2 * y0 - x0 * y2) +
              v2 * (x0 * y1 - x1 * y0)) /
            delta;

          ctx.save();
          ctx.beginPath();
          ctx.moveTo(d0.x, d0.y);
          ctx.lineTo(d1.x, d1.y);
          ctx.lineTo(d2.x, d2.y);
          ctx.closePath();
          ctx.clip();
          ctx.setTransform(ma, md, mb, me, mc, mf);
          ctx.drawImage(sourceCanvas, 0, 0);
          ctx.setTransform(1, 0, 0, 1, 0, 0);

          if (opts.useShade && shade > 0.02) {
            ctx.beginPath();
            ctx.moveTo(d0.x, d0.y);
            ctx.lineTo(d1.x, d1.y);
            ctx.lineTo(d2.x, d2.y);
            ctx.closePath();
            ctx.fillStyle = `rgba(25,18,10,${Math.min(0.55, shade)})`;
            ctx.fill();
          }
          ctx.restore();
        }

        const hold = 0.03;
        const crumpleDur = opts.crumpleDur;
        const settleDur = 0.22;
        const fallDur = 0.75;
        const start = performance.now();
        ctx.drawImage(sourceCanvas, 0, 0);

        const tick = (now) => {
          const t = (now - start) / 1000;
          ctx.setTransform(1, 0, 0, 1, 0, 0);
          ctx.clearRect(0, 0, w, h);

          if (t < hold) {
            ctx.drawImage(sourceCanvas, 0, 0);
            requestAnimationFrame(tick);
            return;
          }

          const local = t - hold;
          const crumpleT = Math.min(1, local / crumpleDur);
          const settleT = Math.max(0, local - crumpleDur);
          const fallT = Math.max(0, local - crumpleDur - settleDur);

          let amount = crumpleT;
          let wadRot = 0;
          let fallY = 0;
          let fallX = 0;
          if (settleT > 0 && fallT <= 0) {
            const s = easeOutCubic(Math.min(1, settleT / settleDur));
            wadRot = s * 0.2;
            amount = 1;
          }
          if (fallT > 0) {
            const f = easeInCubic(Math.min(1, fallT / fallDur));
            amount = 1;
            wadRot = 0.2 + f * 2.8;
            fallY = f * (h - oy + 160);
            fallX = f * f * 40 * (ox < w / 2 ? -1 : 1);
          }

          const cosR = Math.cos(wadRot);
          const sinR = Math.sin(wadRot);
          for (let j = 0; j <= rows; j++) {
            for (let i = 0; i <= cols; i++) {
              const v = grid[j][i];
              const p = crumpleVertex(v, amount);
              let x = p.x - ox;
              let y = p.y - oy;
              const rx = x * cosR - y * sinR;
              const ry = x * sinR + y * cosR;
              v.x = rx + ox + fallX;
              v.y = ry + oy + fallY;
              v.z = p.z;
            }
          }

          const sorted = faces
            .map((face) => {
              const [a, b, c, area0] = face;
              const signed =
                (b.x - a.x) * (c.y - a.y) - (c.x - a.x) * (b.y - a.y);
              const restSigned =
                (b.x0 - a.x0) * (c.y0 - a.y0) - (c.x0 - a.x0) * (b.y0 - a.y0);
              // Drop inverted faces early so they never punch through
              if (signed * restSigned <= 0 || Math.abs(signed) < 1.5) {
                return null;
              }
              const z = (a.z + b.z + c.z) / 3;
              const area = Math.abs(signed);
              const compress = 1 - Math.min(1, area / Math.max(area0, 1));
              const shade = opts.shade(a, z, compress, amount);
              return { a, b, c, z, shade };
            })
            .filter(Boolean)
            .sort((p, q) => p.z - q.z);

          sorted.forEach(({ a, b, c, shade }) => {
            drawSheetTri(a, b, c, a, b, c, shade);
          });

          if (t < hold + crumpleDur + settleDur + fallDur + 0.04) {
            requestAnimationFrame(tick);
          } else {
            canvas.remove();
            opts.onComplete();
          }
        };

        requestAnimationFrame(tick);
      }

      // --- crumble: paper folds along creases, then gathers (no mesh look) ---
      function runCrumble(sourceCanvas, click, onComplete) {
        makeCrumbleSheet(sourceCanvas, click, {
          cols: 28,
          rows: 18,
          wadScale: 0.34,
          crumpleDur: 1.7,
          triPad: 0.45,
          useShade: false,
          shade: () => 0,
          onComplete,
          crumpleVertex: ({ ox, oy, wadR, foldAxis, cellW }) => (v, amount) => {
            const a = Math.min(1, Math.max(0, amount));
            const foldA = easeOutCubic(Math.min(1, a * 1.35));
            const gatherA = Math.pow(Math.max(0, (a - 0.42) / 0.58), 2.35);

            const acrossX = -Math.sin(foldAxis);
            const acrossY = Math.cos(foldAxis);
            const ridge = (c) => Math.sign(c) * Math.pow(Math.abs(c), 0.45);
            // Cap fold so neighbors can't cross → no stabbing triangles
            const maxAmp = cellW * 0.38;
            let amp =
              (ridge(v.crease) * 18 + ridge(v.crease2) * 7) *
              foldA *
              (1 - gatherA * 0.75);
            amp = Math.max(-maxAmp, Math.min(maxAmp, amp));

            let x = v.x0 + acrossX * amp;
            let y = v.y0 + acrossY * amp;

            const dx = x - ox;
            const dy = y - oy;
            const dist = Math.hypot(dx, dy) || 0.0001;
            const ang = Math.atan2(dy, dx);
            const targetR = wadR * (0.94 + 0.06 * v.wr1);
            const r = dist * (1 - gatherA * 0.7) + targetR * gatherA * 0.7;

            x = ox + Math.cos(ang) * r;
            y = oy + Math.sin(ang) * r;

            return {
              x,
              y,
              z: Math.abs(ridge(v.crease)) * 12 * foldA + gatherA * 5,
            };
          },
        });
      }

      // --- crumble2: heavier morph / swirl wad (previous look) ---
      function runCrumble2(sourceCanvas, click, onComplete) {
        makeCrumbleSheet(sourceCanvas, click, {
          cols: 20,
          rows: 13,
          wadScale: 0.3,
          crumpleDur: 1.45,
          triPad: 0.35,
          useShade: true,
          shade: (a, z, compress, amount) =>
            compress * 0.35 +
            Math.max(0, -z) * 0.008 +
            amount * 0.05 * (0.5 + 0.5 * a.wr2),
          onComplete,
          crumpleVertex: ({ ox, oy, wadR, cellW }) => (v, amount) => {
            const a = easeInOutCubic(Math.min(1, Math.max(0, amount)));
            const dx = v.x0 - ox;
            const dy = v.y0 - oy;
            const dist = Math.hypot(dx, dy) || 0.0001;
            const ang = Math.atan2(dy, dx);

            const foldPeak = Math.sin(a * Math.PI);
            const pack = Math.pow(a, 1.25) * 0.68;

            const perpX = -dy / dist;
            const perpY = dx / dist;
            const maxAmp = cellW * 0.42;
            let foldAmp =
              (v.crease * 36 + v.crease2 * 16 + v.wr2 * 8) * foldPeak;
            foldAmp = Math.max(-maxAmp, Math.min(maxAmp, foldAmp));

            const swirl = ang + pack * (0.16 + v.wr1 * 0.1);
            const lump = 0.92 + 0.08 * v.wr1;
            const targetR = wadR * lump + v.crease * 6 + v.wr2 * 3;
            const r = dist * (1 - pack) + targetR * pack;

            const bx = ox + Math.cos(swirl) * r;
            const by = oy + Math.sin(swirl) * r;

            return {
              x: bx + perpX * foldAmp * (1 - pack * 0.55),
              y: by + perpY * foldAmp * (1 - pack * 0.55),
              z:
                Math.abs(v.crease) * 14 * pack +
                foldPeak * Math.abs(v.crease) * 10 +
                pack * 6,
            };
          },
        });
      }

      // --- ripple: water-like radial waves from click reveal the next page ---
      function runRipple(sourceCanvas, click, onComplete) {
        const prev = document.getElementById("shatter-layer");
        if (prev) prev.remove();

        const w = sourceCanvas.width;
        const h = sourceCanvas.height;
        const canvas = document.createElement("canvas");
        canvas.id = "shatter-layer";
        pinCanvas(canvas, w, h);
        document.body.appendChild(canvas);
        const ctx = canvas.getContext("2d");

        const ox =
          click && Number.isFinite(click.x)
            ? Math.min(w, Math.max(0, click.x))
            : w / 2;
        const oy =
          click && Number.isFinite(click.y)
            ? Math.min(h, Math.max(0, click.y))
            : h / 2;

        const maxR =
          Math.hypot(Math.max(ox, w - ox), Math.max(oy, h - oy)) + 60;

        // Half-res buffer for water displacement (keeps it smooth + fast)
        const scale = 0.5;
        const rw = Math.max(1, Math.floor(w * scale));
        const rh = Math.max(1, Math.floor(h * scale));
        const sox = ox * scale;
        const soy = oy * scale;
        const small = document.createElement("canvas");
        small.width = rw;
        small.height = rh;
        const sctx = small.getContext("2d", { willReadFrequently: true });
        sctx.drawImage(sourceCanvas, 0, 0, rw, rh);
        const src = sctx.getImageData(0, 0, rw, rh);
        const srcD = src.data;
        const out = sctx.createImageData(rw, rh);
        const outD = out.data;

        const hold = 0.05;
        const duration = 2.15;
        const start = performance.now();
        ctx.drawImage(sourceCanvas, 0, 0);

        const tick = (now) => {
          const t = (now - start) / 1000;
          ctx.setTransform(1, 0, 0, 1, 0, 0);
          ctx.globalCompositeOperation = "source-over";
          ctx.globalAlpha = 1;
          ctx.clearRect(0, 0, w, h);

          if (t < hold) {
            ctx.drawImage(sourceCanvas, 0, 0);
            requestAnimationFrame(tick);
            return;
          }

          const local = t - hold;
          const e = easeOutCubic(Math.min(1, local / duration));
          // Front of the expanding water wave
          const front = e * maxR * scale;
          // Tighter wavelength = more ripple rings
          const wavelength = 11;
          const travel = local * 48;
          const amp0 = 6.2 * (1 - e * 0.55);

          for (let y = 0; y < rh; y++) {
            for (let x = 0; x < rw; x++) {
              const dx = x - sox;
              const dy = y - soy;
              const dist = Math.hypot(dx, dy);
              const i = (y * rw + x) * 4;

              // Soft reveal: past the wave front, fade out old page
              const past = dist - front;
              if (past < -wavelength * 2.5) {
                outD[i + 3] = 0;
                continue;
              }

              // Several traveling wave trains — more water iterations
              const envelope =
                dist < 2
                  ? 0
                  : Math.exp(-Math.max(0, dist - travel * 0.08) * 0.008) *
                    Math.max(0, 1 - dist / (front + wavelength * 4));
              const phase = dist - travel;
              const wave =
                Math.sin(phase * ((Math.PI * 2) / wavelength)) * 1.0 +
                Math.sin(phase * ((Math.PI * 2) / (wavelength * 0.55)) - 0.4) *
                  0.45 +
                Math.sin(phase * ((Math.PI * 2) / (wavelength * 1.7)) + 0.8) *
                  0.35 +
                Math.sin((dist - travel * 0.72) * ((Math.PI * 2) / wavelength)) *
                  0.55;
              const amp = amp0 * envelope;
              const nx = dist < 0.001 ? 0 : dx / dist;
              const ny = dist < 0.001 ? 0 : dy / dist;
              const sx = x + nx * wave * amp;
              const sy = y + ny * wave * amp;
              const x0 = Math.floor(sx);
              const y0 = Math.floor(sy);

              let r = 255;
              let g = 255;
              let b = 255;
              let a = 255;
              if (x0 >= 0 && y0 >= 0 && x0 < rw - 1 && y0 < rh - 1) {
                const fx = sx - x0;
                const fy = sy - y0;
                const i00 = (y0 * rw + x0) * 4;
                const i10 = i00 + 4;
                const i01 = i00 + rw * 4;
                const i11 = i01 + 4;
                const w00 = (1 - fx) * (1 - fy);
                const w10 = fx * (1 - fy);
                const w01 = (1 - fx) * fy;
                const w11 = fx * fy;
                r =
                  srcD[i00] * w00 +
                  srcD[i10] * w10 +
                  srcD[i01] * w01 +
                  srcD[i11] * w11;
                g =
                  srcD[i00 + 1] * w00 +
                  srcD[i10 + 1] * w10 +
                  srcD[i01 + 1] * w01 +
                  srcD[i11 + 1] * w11;
                b =
                  srcD[i00 + 2] * w00 +
                  srcD[i10 + 2] * w10 +
                  srcD[i01 + 2] * w01 +
                  srcD[i11 + 2] * w11;
                a =
                  srcD[i00 + 3] * w00 +
                  srcD[i10 + 3] * w10 +
                  srcD[i01 + 3] * w01 +
                  srcD[i11 + 3] * w11;
              } else {
                const cx = Math.min(rw - 1, Math.max(0, x0));
                const cy = Math.min(rh - 1, Math.max(0, y0));
                const j = (cy * rw + cx) * 4;
                r = srcD[j];
                g = srcD[j + 1];
                b = srcD[j + 2];
                a = srcD[j + 3];
              }

              // Soft water edge around the expanding front
              let alpha = a;
              if (past > -wavelength * 2.5) {
                const edge =
                  1 -
                  Math.min(
                    1,
                    Math.max(0, (past + wavelength * 2.5) / (wavelength * 2.2)),
                  );
                alpha *= edge;
              }
              // Crest highlight — reads more like water
              const crest = 1 + wave * envelope * 0.1;

              outD[i] = Math.min(255, r * crest);
              outD[i + 1] = Math.min(255, g * crest);
              outD[i + 2] = Math.min(255, b * crest);
              outD[i + 3] = alpha;
            }
          }

          sctx.putImageData(out, 0, 0);
          ctx.imageSmoothingEnabled = true;
          ctx.drawImage(small, 0, 0, w, h);

          if (local < duration + 0.08) {
            requestAnimationFrame(tick);
          } else {
            canvas.remove();
            onComplete();
          }
        };

        requestAnimationFrame(tick);
      }

      function runRipple2(sourceCanvas, click, onComplete) {

      // --- clock: clockwise pie wipe around the click (constant sweep) ---
      function runClock(sourceCanvas, click, onComplete) {
        const prev = document.getElementById("shatter-layer");
        if (prev) prev.remove();

        const w = sourceCanvas.width;
        const h = sourceCanvas.height;
        const canvas = document.createElement("canvas");
        canvas.id = "shatter-layer";
        pinCanvas(canvas, w, h);
        document.body.appendChild(canvas);
        const ctx = canvas.getContext("2d");

        // Always pivot from screen center
        const ox = w / 2;
        const oy = h / 2;

        const maxR =
          Math.hypot(Math.max(ox, w - ox), Math.max(oy, h - oy)) + 60;
        // Start from 12 o'clock; canvas angles increase clockwise
        const startAng = -Math.PI / 2;

        const hold = 0.03;
        const duration = 1.05;
        const start = performance.now();
        ctx.drawImage(sourceCanvas, 0, 0);

        const tick = (now) => {
          const t = (now - start) / 1000;
          ctx.setTransform(1, 0, 0, 1, 0, 0);
          ctx.globalCompositeOperation = "source-over";
          ctx.clearRect(0, 0, w, h);

          if (t < hold) {
            ctx.drawImage(sourceCanvas, 0, 0);
            requestAnimationFrame(tick);
            return;
          }

          // Linear sweep — constant angular speed
          const e = Math.min(1, (t - hold) / duration);
          const endAng = startAng + e * Math.PI * 2;

          ctx.drawImage(sourceCanvas, 0, 0);
          ctx.globalCompositeOperation = "destination-out";
          ctx.beginPath();
          ctx.moveTo(ox, oy);
          ctx.arc(ox, oy, maxR, startAng, endAng, false);
          ctx.closePath();
          ctx.fill();
          ctx.globalCompositeOperation = "source-over";

          if (e < 1) {
            requestAnimationFrame(tick);
          } else {
            canvas.remove();
            onComplete();
          }
        };

        requestAnimationFrame(tick);
      }

      // --- fall: one solid sheet tips over (hinged at bottom, toward you) ---
      function runFall(sourceCanvas, _click, onComplete) {

        // Front-light shade: darkens as the sheet tips (top gets more shadow)
        const shade = document.createElement("div");
        shade.style.cssText = [
          "position:absolute",
          "inset:0",
          "pointer-events:none",
          "background:linear-gradient(to top, rgba(0,0,0,0) 0%, rgba(0,0,0,0.55) 100%)",
          "opacity:0",
